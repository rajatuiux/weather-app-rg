<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />

    <title>Weather App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css?v=2" />
  </head>
  <body>
    <main>
      <div class="logo">
        <div class="logoContainer">
          <div class="logo-face">
            <img src="assets/logo/logo-sun.svg" alt="" id="logoImg" />
          </div>
          <div class="clouds">
            <img
              class="logo-left"
              src="assets/logo/cloud-left.svg"
              alt=""
              id="logoImg"
            />
            <img
              class="logo-right"
              src="assets/logo/cloud-right.svg"
              alt=""
              id="logoImg"
            />
            <img
              class="logo-top"
              src="assets/logo/cloud-top.svg"
              alt=""
              id="logoImg"
            />
          </div>
        </div>
        <h2>SkyCast</h2>
      </div>
      <div class="search">
        <input
          type="text"
          name="searchBox"
          id="searchBox"
          placeholder="Enter city name…"
        />
        <button type="submit">
          <img src="assets/search-icon.svg" alt="" srcset="" />
        </button>
      </div>
      <div class="topContent">
        <div class="cityAndDate">
          <h2 class="city"></h2>
          <p class="dateTime"></p>
        </div>
        <h1 class="temp"></h1>
        <figure class="weather-icon">
          <img src="" alt="" />
        </figure>
        <p class="weather"></p>
      </div>
      <div class="bottomContent">
        <ul class="humidityWind">
          <li class="humidity">
            <img src="assets/humidity.png" alt="" />
            <h3><span></span>%</h3>
            <p class="label">Humidity</p>
          </li>
          <li class="wind">
            <img src="assets/wind.png" alt="" />
            <h3><span></span>km/h</h3>
            <p class="label">Wind Speed</p>
          </li>
          <li class="feels-like">
            <img src="assets/uvindex.png" alt="" />
            <h3><span></span>°C</h3>
            <p class="label">Feels Like</p>
          </li>
          <li class="temp-min">
            <img src="assets/cold-temperature.png" alt="" />
            <h3><span></span>°C</h3>
            <p class="label">Min Temp</p>
          </li>
          <li class="temp-max">
            <img src="assets/hot-temperature.png" alt="" />
            <h3><span></span>°C</h3>
            <p class="label">Max Temp</p>
          </li>
          <li class="pressure">
            <img src="assets/wind.png" alt="" />
            <h3><span></span>hPa</h3>
            <p class="label">Pressure</p>
          </li>
          <li class="visibility">
            <img src="assets/humidity.png" alt="" />
            <h3><span></span>km</h3>
            <p class="label">Visibility</p>
          </li>
        </ul>
      </div>
      <div class="footer">
        <p>Know the temperature and weather conditions of any city.</p>
      </div>
    </main>

    <script src="js/script.js?v=2"></script>
  </body>
</html>
